name: Test Guardian Ranker

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: guardian-test-only
          POSTGRES_DB: guardian_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node --test tests/*.test.js
      - name: Verify migration and database permissions in disposable PostgreSQL
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: guardian-test-only
          PGDATABASE: guardian_test
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/sql/fixture.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202611180001_guardian_index.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/indexer.sql
